services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]
  library-service:
    build: ./library-service
    ports: ["8060:8060"]
    environment:
      PORT: 8060
      DATABASE_URL: postgres://program:test@postgres:5432/libraries
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8060/manage/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]
  reservation-service:
    build: ./reservation-service
    ports: ["8070:8070"]
    environment:
      PORT: 8070
      DATABASE_URL: postgres://program:test@postgres:5432/reservations
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8070/manage/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]
  rating-service:
    build: ./rating-service
    ports: ["8050:8050"]
    environment:
      PORT: 8050
      DATABASE_URL: postgres://program:test@postgres:5432/ratings
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8050/manage/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      LIBRARY_URL: http://library-service:8060
      RESERVATION_URL: http://reservation-service:8070
      RATING_URL: http://rating-service:8050
      REQUEST_TIMEOUT_MS: 2000
      CB_FAILURE_THRESHOLD: 3
      CB_RESET_MS: 3000
      RETRY_INTERVAL_MS: 10000
    depends_on:
      library-service: { condition: service_healthy }
      reservation-service: { condition: service_healthy }
      rating-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/manage/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]

networks:
  library-net:
    driver: bridge
volumes:
  db-data:
